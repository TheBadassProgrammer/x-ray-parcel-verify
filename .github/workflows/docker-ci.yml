name: Docker CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Lint & Smoke Test Container
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS Weights are Pulled
        run: |
          git lfs pull
          ls -lh *.pt

      - name: Set up Python for Syntax & Smoke Checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Python Syntax
        run: |
          python -m py_compile client_code.py demo_app.py
          echo "Syntax verification passed."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: x-ray-parcel-verify:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Docker Container
        run: |
          docker run -d \
            --name x-ray-container \
            -p 8000:8000 \
            -e PORT=8000 \
            -e DEVICE=cpu \
            -e TORCH_THREADS=2 \
            x-ray-parcel-verify:ci

      - name: Wait for API Health Check
        run: |
          echo "Waiting for FastAPI container to initialize models..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "healthy"; then
              echo "Container is healthy and ready!"
              curl -s http://localhost:8000/health
              exit 0
            fi
            echo "Waiting ($i/30)..."
            sleep 3
          done
          echo "Container failed to become healthy. Dumping logs:"
          docker logs x-ray-container
          exit 1

      - name: Run Smoke Test on /upload Endpoint
        run: |
          echo "Sending test image to /upload endpoint..."
          RESPONSE=$(curl -s -X POST "http://localhost:8000/upload" \
            -H "accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@static/sample_result.jpg")
          
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "status" || (echo "Smoke test failed!" && exit 1)
          echo "Smoke test passed successfully!"

      - name: Stop Container
        if: always()
        run: |
          docker stop x-ray-container || true
          docker rm x-ray-container || true

